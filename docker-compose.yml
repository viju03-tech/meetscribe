services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: meetscribe
      POSTGRES_PASSWORD: meetscribe
      POSTGRES_DB: meetscribe
    ports: ["5432:5432"]
    volumes: [meetscribe_pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://meetscribe:meetscribe@db:5432/meetscribe
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: http://localhost:3000
      SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:-local}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
    ports: ["8000:8000"]
    volumes: [meetscribe_storage:/app/storage]
    depends_on: [db, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://meetscribe:meetscribe@db:5432/meetscribe
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /app/storage
      CELERY_ENABLED: "true"
    volumes: [meetscribe_storage:/app/storage]
    depends_on: [db, redis]
    command: celery -A app.worker.celery_app worker --loglevel=info
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  meetscribe_pgdata:
  meetscribe_storage:
